<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#2C1810" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <title>NT Element Cakes — The First Spoon</title>
  </head>
  <body>
    <div id="loading" class="loading">
      <div class="loader-bean"></div>
      <p>Brewing...</p>
    </div>

    <canvas id="scene"></canvas>

    <header class="brand-shell">
      <a class="brand-mark" href="/" aria-label="NT Element Cakes home">
        <img src="/logo.png" alt="NT Element Cakes logo" />
      </a>
      <div class="brand-text">
        <p class="eyebrow">The First Spoon</p>
        <h1 id="brand-title">NT Element Cakes</h1>
      </div>
    </header>

    <main class="copy-panel" id="intro-panel">
      <p id="tagline">Made in Australia.</p>
      <button id="spoon-cta" class="primary-button">Crack the cocoa</button>
      <p class="hint hint-desktop">Move to orbit · click the cocoa to crack</p>
      <p class="hint hint-mobile">Tap the cake to crack it open</p>
    </main>

    <section id="gallery" class="gallery" aria-label="Cake gallery">
      <div class="gallery-copy">
        <h2 id="gallery-title">Choose your slice</h2>
        <p id="about-text"></p>
      </div>
      <div id="card-arc" class="card-arc"></div>
      <nav class="social-bar" aria-label="Order via social media">
        <a class="social-btn" data-social="instagram" href="https://instagram.com/ntelementcakes" target="_blank" rel="noopener noreferrer">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="17.5" cy="6.5" r="1.2" fill="currentColor"/></svg>
          <span>Instagram</span>
        </a>
        <a class="social-btn" data-social="facebook" href="https://facebook.com/ntelementcakes" target="_blank" rel="noopener noreferrer">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13.5 9H16l.5-3h-3V4.5c0-.9.3-1.5 1.6-1.5H16V.2C15.7.1 14.6 0 13.4 0 10.9 0 9.2 1.5 9.2 4.3V6H6.5v3h2.7v9h3.3V9z" fill="currentColor"/></svg>
          <span>Facebook</span>
        </a>
        <a class="social-btn" data-social="messenger" href="https://m.me/ntelementcakes" target="_blank" rel="noopener noreferrer">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2C6.5 2 2 6.1 2 11.2c0 2.9 1.4 5.5 3.7 7.2V22l3.4-1.9c.9.3 1.9.4 2.9.4 5.5 0 10-4.1 10-9.2S17.5 2 12 2zm1 12.3l-2.5-2.7-4.9 2.7 5.4-5.7 2.5 2.7 4.9-2.7-5.4 5.7z" fill="currentColor"/></svg>
          <span>Messenger</span>
        </a>
      </nav>
    </section>

    <button id="reset" class="reset-button" aria-label="Reset spoon interaction">↺ Reset</button>

    <div id="lightbox" class="lightbox" aria-hidden="true" role="dialog" aria-modal="true" aria-label="Cake image viewer">
      <button class="lightbox-close" aria-label="Close">×</button>
      <button class="lightbox-nav lightbox-prev" aria-label="Previous cake">‹</button>
      <img class="lightbox-img" src="" alt="" />
      <button class="lightbox-nav lightbox-next" aria-label="Next cake">›</button>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
