name: Deploy to Vercel

on:
  push:
    branches: [main, development]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (validate locally)
        run: npm run build

      - name: Deploy
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "==> PRODUCTION: ntelementcakes.vercel.app"
            npx vercel@latest deploy --prod --yes --token=${{ secrets.VERCEL_TOKEN }}
          else
            echo "==> STAGING: preview deploy, then alias to ntelementcakes-staging.vercel.app"
            npx vercel@latest deploy --yes --token=${{ secrets.VERCEL_TOKEN }} > /tmp/deploy.log 2>&1
            cat /tmp/deploy.log
            URL=$(grep -oE 'https://ntelementcakes-[a-z0-9]+-[a-z0-9-]+\.vercel\.app' /tmp/deploy.log | head -1)
            if [ -z "$URL" ]; then
              echo "::error::Could not extract preview URL from deploy output"
              exit 1
            fi
            echo "==> Aliasing $URL -> ntelementcakes-staging.vercel.app"
            npx vercel@latest alias set "$URL" ntelementcakes-staging.vercel.app --token=${{ secrets.VERCEL_TOKEN }}
          fi
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
